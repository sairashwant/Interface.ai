{% extends "_layout.html" %} {% block body %}
<h2>Member Search</h2>
<form method="post" action="{{ url_for('member_search') }}">
  <table class="tbl">
    <tr>
      <td>Member ID</td>
      <td>
        <input
          type="text"
          name="member_id"
          aria-label="Member ID"
          value="{{ member_id or '' }}"
        />
      </td>
    </tr>
  </table>
  <p><input type="submit" value="Search" /></p>
</form>
{% if not_found %}
<div class="error" role="alert">
  No member found matching ID "{{ member_id }}".
</div>
{% endif %} {% if result %}
<table class="tbl">
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Action</th>
  </tr>
  <tr>
    <td>{{ result.id }}</td>
    <td>{{ result.name }}</td>
    <td>
      <a href="{{ url_for('member_detail', member_id=result.id) }}"
        >Open Record</a
      >
    </td>
  </tr>
</table>
{% endif %}
<p><a href="{{ url_for('logout') }}">Sign Out</a></p>
{% endblock %}
