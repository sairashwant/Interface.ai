{% extends "_layout.html" %} {% block body %}
<h2>Sign In</h2>
{% if expired %}
<div class="notice" role="alert">
  Your session has expired. Please sign in again.
</div>
{% endif %} {% if error %}
<div class="error" role="alert">{{ error }}</div>
{% endif %}
<form method="post" action="{{ url_for('login') }}">
  <table class="tbl">
    <tr>
      <td>Username</td>
      <td><input type="text" name="username" aria-label="Username" /></td>
    </tr>
    <tr>
      <td>Password</td>
      <td><input type="password" name="password" aria-label="Password" /></td>
    </tr>
  </table>
  <p><input type="submit" value="Sign In" /></p>
</form>
{% endblock %}
